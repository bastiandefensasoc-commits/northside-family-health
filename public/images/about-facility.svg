<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Illustration of the bright, plant-filled waiting area at Northside Family Health">
  <defs>
    <linearGradient id="facility-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf4ee" />
      <stop offset="100%" stop-color="#e8f1f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#facility-bg)" />

  <!-- big window -->
  <rect x="380" y="30" width="190" height="260" rx="16" fill="#ffffff" fill-opacity="0.55" />
  <line x1="475" y1="30" x2="475" y2="290" stroke="#4a7c9b" stroke-opacity="0.2" stroke-width="4" />
  <line x1="380" y1="160" x2="570" y2="160" stroke="#4a7c9b" stroke-opacity="0.2" stroke-width="4" />

  <!-- seating -->
  <g transform="translate(60,270)">
    <rect x="0" y="0" width="120" height="70" rx="18" fill="#4a7c9b" fill-opacity="0.85" />
    <rect x="10" y="-30" width="100" height="40" rx="14" fill="#4a7c9b" fill-opacity="0.6" />
  </g>
  <g transform="translate(210,270)">
    <rect x="0" y="0" width="120" height="70" rx="18" fill="#6fa287" fill-opacity="0.85" />
    <rect x="10" y="-30" width="100" height="40" rx="14" fill="#6fa287" fill-opacity="0.6" />
  </g>

  <!-- plants -->
  <g transform="translate(500,360)">
    <rect x="-22" y="0" width="44" height="46" rx="8" fill="#57876d" />
    <path d="M0 0c0-42-42-62-62-72 20 52 20 84 62 72Z" fill="#7fb494" />
    <path d="M0 0c0-48 48-66 70-78-18 56-20 92-70 78Z" fill="#6fa287" />
  </g>
  <g transform="translate(30,60)">
    <rect x="-16" y="0" width="32" height="34" rx="6" fill="#57876d" />
    <path d="M0 0c0-30-30-44-44-50 14 36 14 60 44 50Z" fill="#7fb494" />
  </g>

  <!-- floor -->
  <line x1="0" y1="400" x2="600" y2="400" stroke="#4a7c9b" stroke-opacity="0.12" stroke-width="2" />
</svg>
